# Render — Dart backend
# IMPORTANT: For detea-backend.onrender.com, set in Render dashboard:
#   Root Directory = server
#   Runtime = Docker
#   Branch = THE-GREAT-FLUTTER-DIVERSION (or main, whichever you deploy)
#   GOOGLE_CLOUD_PROJECT = my-socitea
#   GOOGLE_CREDENTIALS = <full my-socitea service-account JSON>
# After deploy, /health MUST include "runtime":"dart" and "project":"my-socitea"
services:
  - type: web
    name: detea-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_CLOUD_PROJECT
        value: my-socitea
      - key: FIREBASE_PROJECT_ID
        value: deitedatabase
      - key: VERTEX_LOCATION
        value: us-central1
      - key: VERTEX_GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /app/service-account.json
      # Set GOOGLE_CREDENTIALS in the Render dashboard (secret) — do not commit JSON here.
      - key: GOOGLE_CREDENTIALS
        sync: false
